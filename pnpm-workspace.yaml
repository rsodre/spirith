packages:
  - apps/*
  - packages/*
  - contracts

# Shared external versions live here. Manifests reference them as "catalog:".
# Bump the catalog, never a package manifest.
catalog:
  '@biomejs/biome': 2.5.12
  '@graphprotocol/graph-cli': 0.98.1
  '@graphprotocol/graph-ts': 0.38.2
  '@modelcontextprotocol/sdk': 1.30.0
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/react-query': 5.102.8
  '@types/node': 26.4.1
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  connectkit: 1.9.2
  lucide-react: 1.43.0
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  sonner: 2.0.8
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  tsdown: 0.23.0
  tsx: 4.23.13
  typescript: 5.9.3
  viem: 2.56.3
  vitest: 5.0.0
  wagmi: 2.19.5
  zod: 4.5.4

# Every dependency with an install script gets an explicit answer.
onlyBuiltDependencies:
  - esbuild # vitest -> vite -> esbuild downloads its platform binary in postinstall
# Native optional speed-ups pulled in by WalletConnect's websocket stack; every one has a pure-JS
# fallback, so their compile step is skipped rather than approved.
ignoredBuiltDependencies:
  - bufferutil
  - keccak
  - utf-8-validate
