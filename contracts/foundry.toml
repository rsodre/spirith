[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../packages/core/deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 32

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[lint]
# Vendored ENS interfaces keep their upstream ">=0.8.13" pragma on purpose.
exclude_lints = ["pragma-inconsistent"]

[fmt]
line_length = 100
tab_width = 4
